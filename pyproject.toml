[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Generador de laberintos perfectos y tipo Pac-Man con un patron 42 protegido en el centro."
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }

[project.optional-dependencies]
dev = [
    "flake8==7.3.0",
    "mypy==2.3.1",
    "build==1.5.0",
]

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["README.md"]